<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Juliet</title>
  <style>
    :root {
      color-scheme: light dark;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #1e1b4b 0%, #4c1d95 100%);
      color: #f5f3ff;
      padding: 2rem;
    }
    .card {
      max-width: 640px;
      text-align: center;
    }
    h1 {
      font-size: 3.5rem;
      margin: 0 0 0.5rem;
      letter-spacing: -0.02em;
    }
    p {
      font-size: 1.15rem;
      line-height: 1.6;
      opacity: 0.9;
      margin: 0 0 1.5rem;
    }
    .badge {
      display: inline-block;
      padding: 0.5rem 1.25rem;
      border: 1px solid rgba(255, 255, 255, 0.35);
      border-radius: 999px;
      font-size: 0.9rem;
      letter-spacing: 0.03em;
      background: rgba(255, 255, 255, 0.08);
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Juliet</h1>
    <p>Esta es la página de ejemplo servida con GitHub Pages. Edita <code>index.html</code> para añadir tu contenido.</p>
    <span class="badge">GitHub Pages &bull; activo</span>
  </main>
</body>
</html>
